name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Run-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Type Checking
        run: uv run ty check

      - name: Run Linter
        run: uv run ruff check

      - name: Validate CITATION.cff
        run: uvx cffconvert --validate

      - name: Check for Schema drift
        run: |
          uv run fridge config-schema
          if [[ -n $(git diff) ]]; then
            echo 'Config JSON Schemas not up to date. Run fridge config-schema and re-commit.' >&2
            exit 1
          fi

      - name: Run Tests
        run: uv run pytest
