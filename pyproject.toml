[project]
name = "fridge"
version = "1.0.0"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yunji Rosie Kim", email = "ykim985@gatech.edu" },
    { name = "Austin Weeks", email = "austin.weeks@gatech.edu"  },
    { name = "Jeremy Garcia", email = "jgarcia404@gatech.edu" },
]
requires-python = ">=3.13"
dependencies = [
    "gurobipy>=13.0.1",
    "haversine>=2.9.0",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "numpy>=2.3.3",
    "pydantic>=2.12.5",
    "pyshp>=3.1.6",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "typer>=0.19.2",
]

[project.scripts]
fridge = "cli.main:app"


[tool.hatch.build.targets.wheel]
only-include = ["src/railgen", "src/cli"]
sources = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
