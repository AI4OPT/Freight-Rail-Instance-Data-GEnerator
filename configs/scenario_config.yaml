# yaml-language-server: $schema=../schema/scenario_config.schema.json

general_settings:
  seed: null
  scenario_count: 50
  minimum_dwell_share: 0.75
distributions_pool: {}
default_distributions:
  initial_departure: # minutes; 80% late (mean 120), 20% early (mean 30)
    distr_type: asymmetric_laplace
    location: 0.0
    scale: 60.0
    skew: 0.5
  trip_time_percent_diff: # percent of planned run time; 67% slower (mean 7.1), 33% faster (mean 3.5)
    distr_type: asymmetric_laplace
    location: 0.0
    scale: 5.0
    skew: 0.7
  dwell_time: # extra minutes at a stop; median e^log_mean = 15, mean 25
    distr_type: log_normal
    log_mean: 2.708
    log_stdev: 1.0
train_category_distributions_overrides: {}
yard_group_dwell_distributions: {}
leg_trip_time_percent_diff_distributions: {}
region_distributions: []
