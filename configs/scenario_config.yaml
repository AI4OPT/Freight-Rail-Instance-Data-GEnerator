# yaml-language-server: $schema=../schema/scenario_config.schema.json

general_settings:
  seed: null
  scenario_count: 50
  minimum_dwell_share: 0.75
distributions_pool: {}
default_distributions:
  initial_departure:
    distr_type: mixture
    components:
      - weight: 0.25
        distribution: # always 0
          distr_type: normal
          mean: 0.0
          stdev: 0.0
      - weight: 0.40
        negate: true # drawn as minutes early
        distribution: # exponential, mean 86.6 = 60 / ln 2
          distr_type: weibull
          shape: 1.0
          scale: 86.6
      - weight: 0.35
        distribution: # mean about 141
          distr_type: weibull
          shape: 0.685
          scale: 108.9
  trip_time_percent_diff: # percent of planned run time; half slower, half faster (mean 5 each); 80% within ±8
    distr_type: asymmetric_laplace
    location: 0.0
    scale: 5.0
    skew: 1.0
  dwell_time:
    distr_type: log_normal
    location: -40.0
    log_mean: 3.85
    log_stdev: 0.40
train_category_distributions_overrides: {}
yard_dwell_distributions: {}
leg_trip_time_percent_diff_distributions: {}
region_distributions: []
