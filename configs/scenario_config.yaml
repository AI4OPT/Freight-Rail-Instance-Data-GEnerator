# yaml-language-server: $schema=../schema/scenario_config.schema.json

general_settings:
  seed: null
  scenario_count: 50
  minimum_dwell_share: 0.75
distributions_pool: {}
default_distributions:
  initial_departure:
    distr_type: mixture
    components:
      - weight: 0.40
        negate: true # drawn as minutes early
        distribution:
          distr_type: weibull
          shape: 1.0
          scale: 86.6
      - weight: 0.60
        distribution:
          distr_type: weibull
          shape: 0.5
          scale: 30.0
  trip_time_percent_diff:
    distr_type: log_normal
    location: -20.0
    log_mean: 3.0
    log_stdev: 0.32
  dwell_time:
    distr_type: log_normal
    location: -40.0
    log_mean: 3.85
    log_stdev: 0.40
train_category_distributions_overrides: {}
yard_dwell_distributions: {}
leg_trip_time_percent_diff_distributions: {}
region_distributions: []
