general_settings:
  train_seed: null
  data_output_dir: output
  seg_freq_arc_cost_discount_alpha: 0.3
  lambda: 0.5
  median_f: 72.0

network_settings:
  hub_locations:
    - city: Portland
      state: OR
    - city: Seattle
      state: WA
    - city: Oakland
      state: CA
    - city: Los Angeles
      state: CA
    - city: Salt Lake City
      state: UT
    - city: Kansas City
      state: MO
    - city: Fort Worth
      state: TX
    - city: Houston
      state: TX
    - city: Minneapolis
      state: MN
    - city: Chicago
      state: IL
    - city: Memphis
      state: TN
    - city: New Orleans
      state: LA
    - city: San Antonio
      state: TX
    - city: Pittsburgh
      state: PA
    - city: Secaucus
      state: NJ
    - city: Birmingham
      state: AL
    - city: Atlanta
      state: GA
    - city: Norfolk
      state: VA
    - city: Baltimore
      state: MD
    - city: Detroit
      state: MI
  min_od_yg_spacing_km: 5.0 # minimum track distance between two yard groups representing the same FAF zone
  min_od_yg_track_km: 2.0 # minimum track length of a yard group chosen by distance for a zone with no city match (waived if none qualifies)
  # NET codes of the rail network lines the walk between yard groups does not use (applied when graph.gexf is generated):
  # A abandoned, R abandoned and removed, X out of service, T trail on a former rail line, F rail ferry.
  excluded_track_net_codes:
    - A
    - R
    - X
    - T
    - F
  od_discount_factor: 0.7
  per_grade_speed_reduction: 0.1
  max_speed_reduction: 0.5

train_settings:
  speed_km_h: 40

# Train generator (service network design).
# Dwell minutes by event combination at an intermediate stop; crew usable hours = duty_hours - terminal_hours.
service_design_settings:
  faf_year: "2022"
  multimodal_rail_share: 0.5 # share of FAF "multiple modes" tons counted as rail (the intermodal group)
  multimodal_min_miles: 500.0 # count them only on zone pairs whose multiple-modes freight averages at least this many miles (FAF5); 0 = every zone pair
  multimodal_max_miles: 2500.0 # and at most this many miles (coast to coast is not one train); 0 = no upper limit
  region: # which part of the network the instance covers; `--region` overrides `instance`
    instance: full # full | east | west (east/west: flows crossing the boundary are cut where their route reaches the other side; see regions.py)
    west_states: [MN, IA, MO, AR, LA, WI, ND, SD, NE, KS, OK, TX, MT, WY, CO, NM, ID, UT, AZ, WA, OR, NV, CA, AK, HI]
    gateway_zones: ["171", "181", "172", "292", "201", "291", "471", "223"] # Chicago, St. Louis, Kansas City, Memphis, New Orleans: in both regions
    gateway_radius_km: 25.0 # yard groups this close to a gateway zone's yard groups are in both regions
  excluded_zones: # FAF zones whose rows are dropped, as origin or as destination
    - "020" # Alaska: its track is not connected to the rest of the network
  freight_groups:
    coal:
      - "15"
    grain:
      - "02"
    ores_minerals:
      - "13"
      - "14"
    aggregates:
      - "10"
      - "11"
      - "12"
    petroleum_energy:
      - "16"
      - "17"
      - "18"
      - "19"
    automotive:
      - "36"
      - "37"
  group_train_types: 
    coal:
      - coal
      - manifest
    grain:
      - grain
      - manifest
    ores_minerals:
      - ores_minerals
      - manifest
    aggregates:
      - aggregates
      - manifest
    petroleum_energy:
      - petroleum_energy
      - manifest
    automotive:
      - automotive
    manifest:
      - manifest
    intermodal:
      - intermodal
  train_type_category:
    coal: B
    grain: B
    ores_minerals: B
    aggregates: B
    petroleum_energy: B
    manifest: M
    automotive: A
    intermodal: I
  excluded_flows:
    - origin_zone: "261"
      destination_zone: "261"
      sctg:
        - "11"
        - "12"
      reason:
        "Detroit intra-zone sand and gravel: 1.08M t/week, 28% of FAF's national rail aggregates,
        about half of AAR's national total."
  intra_zone_min_miles: 25.0
  min_od_tons_per_week: # drop a zone pair's flow of a category below this many t/week (before the yard-pair split)
    A: 3500.0
    M: 15000.0
    B: 20000.0
    I: 8500.0
  yard_pairs:
    assignment: one_per_category # one_per_category | split_by_tonnage
    tonnage_step: 11000.0 # split_by_tonnage only
    distance_tolerance: 0.3
    max_pairs: 3 # split_by_tonnage only
  work_yards_per_state: 3
  max_trailing_tons_per_run: 10000.0 # default, for a category not listed below
  # Max weight of one train run on any leg, by train category: freight plus the cars that carry it (car_weight).
  # The freight a run may carry is this / (1 + empty car / cargo per car), e.g. M: 20,000 / (1 + 33/90) = 14,634 t.
  max_trailing_tons_per_run_by_category:
    A: 6500.0
    M: 13000.0
    B: 17000.0
    I: 12000.0
  max_runs_per_week: 7
  max_symbols_per_service: 2 # limit on runs per week = max_runs_per_week x max_symbols_per_service
  costs:
    train_start: 25.0 
    per_train_mile: 0.1 
    per_distinct_train: 7500.0 # weekly charge for each train that runs at all, whatever its runs
    transfer_fixed: 20.0 # cost per change of train of a commodity at a yard
    transfer_per_ton: 0.01 # plus this per ton/week of that commodity
  crew:
    duty_hours: 12.0
    terminal_hours: 0.0
  dwell_minutes:
    crew_only: 20.0
    so: 30.0
    pu: 60.0
    pu_so: 90.0
    so_crew: 70.0
    pu_crew: 80.0
    pu_so_crew: 140.0
  # Tons behind the locomotives on a leg (trailing tons) = tons of freight x (1 + empty car / cargo per car):
  # the freight fills freight / cargo-per-car cars, and each car adds its empty weight.
  # Used for the locomotive count, and as the tonnage of return trips; otherwise the tonnage columns of the schedule are tons of freight.
  car_weight:
    empty_car_tons_by_category: # weight of one empty car, in tons (0 = freight only)
      A: 50.0
      M: 33.0
      B: 29.0
      I: 30.0
    cargo_tons_per_car_by_category: # freight in one loaded car, in tons
      A: 20.0
      M: 90.0
      B: 100.0
      I: 60.0
  # Return trips, added after the trains are built to reduce the locomotive imbalance between yard groups:
  # the train continues as the same symbol straight back to its origin, carrying its empty cars
  # (shown as the leg's tonnage), with the locomotives of its heaviest leg.
  return_trips:
    circuitous_share: {} # per category, e.g. {M: 0.1, B: 0.1}: share of short trains that come back, chosen at random
    circuitous_max_miles: 225.0 # one-way length up to which a train is short
    empty_return_share: {} # per category, e.g. {B: 0.5}: at most this share come back, chosen where it helps balance most
  # Locomotives on a leg = hp per ton x trailing tons / locomotive_hp, rounded up.
  # hp per ton = the larger of the train category's value below and what the leg's ruling grade needs:
  # (rolling_resistance_lb_per_ton + 20 x grade %) x min_speed_mph / (375 x transmission_efficiency).
  locomotive_power:
    locomotive_hp: 4400.0
    hp_per_ton_by_category: # horsepower per trailing ton a train of each category runs with
      A: 1.4
      M: 1.3
      B: 0.78
      I: 1.5
    rolling_resistance_lb_per_ton: 2.0
    min_speed_mph: 10.0 # slowest speed accepted on the ruling grade
    transmission_efficiency: 0.82 # share of locomotive horsepower that reaches the rails
    min_grade_hop_km: 5.0 # a hop shorter than this has no grade
  solver:
    time_limit_s: 600.0
    mip_gap: 0.02
    log_file: gurobi_service_design.log
